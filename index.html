<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<title>内部资料站</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fff;--soft:#f7f8fa;--line:#e6e9ee;--line2:#d5dae2;
  --fg:#141a23;--fg2:#5a6472;--fg3:#8b95a3;
  --accent:#1a5fd0;--accent-bg:#eff4ff;--accent-line:#c3d7f7;
  --danger:#b42318;--danger-bg:#fef5f4;--danger-line:#f2cbc7;
  --ok:#0f7b3c;--warn-bg:#fffaf0;--warn-line:#f0dcb4;
  --r:10px;--r2:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-word}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* 顶栏 */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:500;font-size:14px;min-width:0}
.brand span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.right{display:flex;align-items:center;gap:10px;flex:none}
.who{font-size:12px;color:var(--fg3);font-family:var(--mono);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.who{display:none}}

.btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--fg);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--fg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg2);padding:6px 8px}
.btn.ghost:hover{background:var(--soft);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 布局 */
.cols{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start;min-height:calc(100vh - 54px)}
.side{border-right:1px solid var(--line);padding:26px 16px 70px;position:sticky;top:54px;max-height:calc(100vh - 54px);overflow:auto}
.side h4{margin:0 0 10px;padding:0 10px;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--fg3);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:block;padding:7px 10px;border-radius:7px;font-size:13.5px;color:var(--fg2);line-height:1.5}
.nav a:hover{background:var(--soft);color:var(--fg);text-decoration:none}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
.doc{padding:34px 44px 90px;max-width:760px;min-width:0}
@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:14px 20px}
  .side h4{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav a{border:1px solid var(--line);padding:5px 11px;font-size:13px}
  .nav a.on{border-color:var(--accent-line)}
  .doc{padding:26px 20px 70px}
}

/* 排版 */
.doc h1{font-size:25px;font-weight:500;margin:0 0 18px;letter-spacing:-.01em}
.doc h2{font-size:19px;font-weight:500;margin:34px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;font-weight:500;margin:26px 0 10px}
.doc h4,.doc h5,.doc h6{font-size:15px;font-weight:500;margin:22px 0 8px;color:var(--fg2)}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px}
.doc li{margin:4px 0}
.doc blockquote{margin:0 0 14px;padding:2px 0 2px 15px;border-left:2px solid var(--line2);color:var(--fg2)}
.doc hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.doc pre.code{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow:auto;margin:0 0 16px;font-size:13px;line-height:1.65}
.doc pre.code code{background:none;border:0;padding:0;font-size:inherit}
.doc strong{font-weight:500}
.doc img{max-width:100%;border-radius:var(--r)}
.tw{overflow-x:auto;margin:0 0 16px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc th,.doc td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.doc th{background:var(--soft);font-weight:500}

/* 门禁页 */
.gate{max-width:620px;margin:0 auto;padding:56px 20px 90px}
.gate h1{font-size:23px;font-weight:500;margin:0 0 10px;letter-spacing:-.01em}
.gate .lead{color:var(--fg2);margin:0 0 26px;font-size:14.5px}
.card{border:1px solid var(--line);border-radius:var(--r2);padding:22px 24px;margin:0 0 16px;background:#fff}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card.bad{background:var(--danger-bg);border-color:var(--danger-line)}
.card.ok{background:var(--accent-bg);border-color:var(--accent-line)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 34px;font-size:14px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center;font-weight:500}
.steps li b{font-weight:500}
.hint{font-size:12.5px;color:var(--fg3);line-height:1.6;margin:10px 0 0}
.field{display:flex;gap:8px;margin:16px 0 6px}
.field input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:13px;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--fg)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.msg{font-size:13px;margin-top:10px;min-height:19px}
.msg.err{color:var(--danger)}
.msg.good{color:var(--ok)}
.kbd{font-family:var(--mono);font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.spin{width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--fg3);font-size:14px;padding:70px 0}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg3);line-height:1.7}
</style>
</head>
<body>

<header class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="brand"><span class="mark"></span><span class="nm" id="brandName">内部资料站</span></div>
    <div class="right">
      <span class="who" id="who"></span>
      <button class="btn ghost" id="exitBtn" type="button">退出</button>
    </div>
  </div>
</header>

<main id="stage"><div class="center"><span class="spin"></span></div></main>

<script>
/* ==========================================================================
   配置区 —— 部署前只需要改这一段
   ========================================================================== */
const CONFIG = {
  owner: 'bjtu-guitar-association',
  repo:  'inner-content',
  branch: 'main',
  siteConfig: '_site.json',
  tokenKey: 'ghgate.token.v1',
  cachePrefix: 'ghgate.cache.',
  cacheTtl: 5 * 60 * 1000
};

const API = 'https://api.github.com';
const stage = document.getElementById('stage');
const bar = document.getElementById('bar');

let STATE = { token: null, login: null, site: null, path: null, cache: new Map() };

/* ---------- 小工具 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function b64utf8(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

/* ==========================================================================
   Markdown 渲染器（自实现，零 CDN 依赖）
   ========================================================================== */
function renderMd(src){
  const codes = [];
  let t = String(src).replace(/\r\n?/g,'\n');

  // 1. 先摘出围栏代码块，避免内部被当成 markdown 解析
  t = t.replace(/```([^\n]*)\n([\s\S]*?)(?:```|$)/g, (m, info, code) => {
    codes.push({ info: String(info).trim(), code: code.replace(/\n+$/,'') });
    return '\u0001C' + (codes.length - 1) + '\u0001';
  });

  // 2. 整体转义，之后所有替换都在安全文本上进行
  t = esc(t);

  // 3. 行内元素
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  t = t.replace(/(?<![*\w])\*([^\s*](?:[^*\n]*[^\s*])?)\*(?![*\w])/g, '<em>$1</em>');
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) =>
    /^(https?:|\/)/i.test(src) ? '<img src="'+src+'" alt="'+alt+'">' : alt);
  t = t.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (m, txt, href) => {
    const safe = /^(https?:|\/|#|mailto:)/i.test(href) ? href : '#';
    return '<a href="'+safe+'" target="_blank" rel="noopener noreferrer">' + (txt || href) + '</a>';
  });

  // 4. 逐行做块级结构
  const lines = t.split('\n');
  const out = [];
  let listType = null, para = [];

  const closeList = () => { if (listType) { out.push('</' + listType + '>'); listType = null; } };
  const flushPara = () => { if (para.length) { out.push('<p>' + para.join(' ') + '</p>'); para = []; } };
  const flushAll  = () => { flushPara(); closeList(); };

  for (let i = 0; i < lines.length; i++){
    const line = lines[i].trim();

    if (/^\u0001C\d+\u0001$/.test(line)) { flushAll(); out.push(line); continue; }
    if (!line) { flushAll(); continue; }

    // 表格
    if (line.charAt(0) === '|' && /^\|[\s:\-|]+\|$/.test((lines[i+1]||'').trim())) {
      flushAll();
      const rows = [line];
      i += 2;
      while (i < lines.length && lines[i].trim().charAt(0) === '|') { rows.push(lines[i].trim()); i++; }
      i--;
      const cut = r => r.replace(/^\||\|$/g,'').split('|').map(c => c.trim());
      out.push('<div class="tw"><table>' + rows.map((r, k) =>
        '<tr>' + cut(r).map(c => '<' + (k ? 'td' : 'th') + '>' + c + '</' + (k ? 'td' : 'th') + '>').join('') + '</tr>'
      ).join('') + '</table></div>');
      continue;
    }

    // 标题
    let m = line.match(/^(#{1,6})\s+(.+)$/);
    if (m) { flushAll(); const lv = m[1].length; out.push('<h' + lv + '>' + m[2] + '</h' + lv + '>'); continue; }

    // 分隔线
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { flushAll(); out.push('<hr>'); continue; }

    // 引用
    if (line.indexOf('&gt;') === 0) {
      flushAll();
      const q = [];
      while (i < lines.length && lines[i].trim().indexOf('&gt;') === 0) {
        q.push(lines[i].trim().replace(/^&gt;\s?/,''));
        i++;
      }
      i--;
      out.push('<blockquote>' + q.join(' ') + '</blockquote>');
      continue;
    }

    // 列表
    m = line.match(/^([-*+])\s+(.+)$/);
    if (m) {
      flushPara();
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + m[2] + '</li>');
      continue;
    }
    m = line.match(/^(\d+)[.)]\s+(.+)$/);
    if (m) {
      flushPara();
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + m[2] + '</li>');
      continue;
    }

    para.push(line);
  }
  flushAll();

  // 5. 还原代码块
  return out.join('\n').replace(/\u0001C(\d+)\u0001/g, (m, idx) => {
    const c = codes[+idx];
    const lang = c.info ? ' data-lang="' + esc(c.info.split(/\s+/)[0]) + '"' : '';
    return '<pre class="code"><code' + lang + '>' + esc(c.code) + '</code></pre>';
  });
}

/* ==========================================================================
   GitHub API
   ========================================================================== */
async function gh(path, token){
  const res = await fetch(API + path, {
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json'
    },
    cache: 'no-store'
  });
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  return { status: res.status, data: data, headers: res.headers };
}

async function fetchFile(path, token){
  const key = CONFIG.cachePrefix + path;
  const hit = STATE.cache.get(path) || (() => {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  })();

  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) {
    STATE.cache.set(path, hit);
    return { ok: true, text: hit.text, cached: true };
  }

  const url = '/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/'
            + path.split('/').map(encodeURIComponent).join('/')
            + '?ref=' + encodeURIComponent(CONFIG.branch);
  const r = await gh(url, token);

  if (r.status === 200 && r.data) {
    if (r.data.encoding === 'none' || !r.data.content) {
      return { ok: false, code: 'toolarge', size: r.data.size || 0 };
    }
    const text = b64utf8(r.data.content);
    const rec = { at: Date.now(), text: text };
    STATE.cache.set(path, rec);
    try { localStorage.setItem(key, JSON.stringify(rec)); } catch (e) {}
    return { ok: true, text: text, cached: false };
  }
  return { ok: false, code: r.status };
}

/* ==========================================================================
   渲染
   ========================================================================== */
function goHome(url){ location.href = url || location.pathname; }

function renderLoading(text){
  stage.innerHTML = '<div class="center"><span class="spin"></span> ' + esc(text || '正在检查访问权限') + '<\/div>';
}

function renderLogin(reason){
  bar.hidden = true;
  const turl = 'https://github.com/settings/personal-access-tokens/new'
    + '?name=' + encodeURIComponent(CONFIG.owner + ' 资料站')
    + '&description=' + encodeURIComponent('只读访问 ' + CONFIG.owner + '/' + CONFIG.repo)
    + '&target_name=' + encodeURIComponent(CONFIG.owner);

  stage.innerHTML = ''
  + '<div class="gate">'
  +   '<h1>需要授权才能查看</h1>'
  +   '<p class="lead">这个站点本身不存放任何内容。所有资料都在一个<strong>私有仓库</strong>里，只有该仓库的成员能读取。'
  +   '你的浏览器需要凭证，才能替你去仓库里取内容。</p>'
  +   (reason ? '<div class="card bad"><div class="msg err" style="margin:0">' + esc(reason) + '<\/div><\/div>' : '')
  +   '<div class="card">'
  +     '<ol class="steps">'
  +       '<li><b>打开令牌生成页</b><div class="hint">下面这个链接已经帮你填好了名称和组织，点开即可。<br>'
  +         '<a class="btn primary" style="display:inline-block;margin-top:8px" href="' + turl + '" target="_blank" rel="noopener noreferrer">去 GitHub 生成访问令牌<\/a><\/div><\/li>'
  +       '<li style="margin-top:18px"><b>把权限收紧到最小</b><div class="hint">'
  +         'Repository access 选 <span class="kbd">Only select repositories</span>，只勾 <span class="kbd">'
  +         esc(CONFIG.owner + '/' + CONFIG.repo) + '<\/span>。<br>'
  +         'Permissions 里把 <span class="kbd">Contents</span> 设为 <span class="kbd">Read-only</span>，其余全部留空。<br>'
  +         'Expiration 按需选择（建议 90 天，到期重来一次）。<\/div><\/li>'
  +       '<li style="margin-top:18px"><b>生成并复制</b><div class="hint">点最下方 Generate token，得到一串以 <span class="kbd">github_pat_</span> 开头的字符，复制它。<\/div><\/li>'
  +       '<li style="margin-top:18px"><b>粘贴到下面<\/b><div class="hint">只保存在你这个浏览器里。<\/div><\/li>'
  +     '<\/ol>'
  +     '<div class="field">'
  +       '<input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴令牌，形如 github_pat_...">'
  +       '<button class="btn primary" id="submit" type="button" style="flex:none">进入<\/button>'
  +     '<\/div>'
  +     '<div class="msg" id="msg"><\/div>'
  +     '<div class="hint">如果组织启用了令牌审批策略，你的令牌可能需要管理员先批准一次，之后才能读到仓库。<\/div>'
  +   '<\/div>'
  +   '<div class="foot">令牌通过加密的 HTTPS 直接发往 api.github.com，<strong>不会经过任何第三方服务器<\/strong>——这个页面没有后端。'
  +   '你随时可以在 GitHub 的令牌列表里撤销它，或者点顶部的「退出」清除本地记录。<\/div>'
  + '<\/div>';

  const input = document.getElementById('tok');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');

  const submit = async () => {
    const v = input.value.trim();
    if (!v) { msg.className = 'msg err'; msg.textContent = '先粘贴令牌。'; return; }
    btn.disabled = true; input.disabled = true;
    msg.className = 'msg'; msg.innerHTML = '<span class="spin"></span> 正在验证…';
    const check = await gh('/user', v);
    if (check.status === 200 && check.data && check.data.login) {
      msg.className = 'msg good'; msg.textContent = '验证通过，正在载入…';
      localStorage.setItem(CONFIG.tokenKey, v);
      STATE.token = v; STATE.login = check.data.login;
      boot();
    } else if (check.status === 401) {
      msg.className = 'msg err'; msg.textContent = '令牌无效或已过期，请重新生成。';
      btn.disabled = false; input.disabled = false;
    } else {
      msg.className = 'msg err'; msg.textContent = '验证请求失败（HTTP ' + check.status + '），稍后重试。';
      btn.disabled = false; input.disabled = false;
    }
  };

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  input.focus();
}

function renderDenied(kind, detail){
  bar.hidden = true;
  const isNoPerm = kind === 'noperm';
  stage.innerHTML = ''
  + '<div class="gate">'
  +   '<h1>' + (isNoPerm ? '读不到内容仓库' : '请求被 GitHub 拒绝') + '<\/h1>'
  +   '<p class="lead">' + (isNoPerm
        ? '令牌本身是有效的，但在 <strong>' + esc(CONFIG.owner + '/' + CONFIG.repo) + '<\/strong> 的 <code>' + esc(CONFIG.branch) + '<\/code> 分支上取不到 <code>' + esc(CONFIG.siteConfig) + '<\/code>。'
        : '可能是短时间内请求过多，或令牌权限不足。') + '<\/p>'
  +   '<div class="card warn">'
  +     '<div style="font-weight:500;margin-bottom:6px">' + (isNoPerm ? '两类原因，先排除第一类' : '细节') + '<\/div>'
  +     (isNoPerm
        ? '<ul style="margin:0;padding-left:20px;font-size:14px;color:var(--fg2)">'
        +   '<li><strong>文件不在那个位置</strong>：<code>' + esc(CONFIG.repo) + '<\/code> 仓库的 <code>' + esc(CONFIG.branch) + '<\/code> 分支根目录下，要能直接看到 <code>' + esc(CONFIG.siteConfig) + '<\/code>。多套了一层文件夹，或者仓库名、分支名写错，都会是这个结果<\/li>'
        +   '<li>你的账号不在 <strong>' + esc(CONFIG.owner) + '<\/strong> 这个组织里，或者没被加进能读该仓库的团队<\/li>'
        +   '<li>生成令牌时没有勾选这个仓库（Repository access 选错了）<\/li>'
        +   '<li>勾了仓库，但 <span class="kbd">Contents<\/span> 权限留成了 No access<\/li>'
        +   '<li>组织开启了令牌审批，管理员还没批准你这个令牌<\/li>'
        +   '<\/ul>'
        : '<div class="msg" style="margin:0;color:var(--fg2);font-family:var(--mono);font-size:12.5px">' + esc(detail || '') + '<\/div>')
  +   '<\/div>'
  +   '<div class="card ok">先按第一条核一遍文件路径和分支名，确认无误后再换令牌。点下面的按钮回到授权页；如果你认为自己本该有权限，把上面的原因截图发管理员。<\/div>'
  +   '<button class="btn primary" id="again" type="button">换一张令牌<\/button>'
  + '<\/div>';

  document.getElementById('again').addEventListener('click', () => {
    localStorage.removeItem(CONFIG.tokenKey);
    STATE.token = null;
    renderLogin(null);
  });
}

function renderError(title, m){
  bar.hidden = true;
  stage.innerHTML = '<div class="gate"><h1>' + esc(title || '出错了') + '<\/h1>'
    + '<div class="card bad"><div class="msg err" style="margin:0">' + esc(m) + '<\/div><\/div>'
    + '<button class="btn" type="button" id="reload">重新加载<\/button><\/div>';
  const b = document.getElementById('reload');
  if (b) b.addEventListener('click', () => location.reload());
}

function renderDocs(){
  const nav = (STATE.site && Array.isArray(STATE.site.nav) && STATE.site.nav.length)
    ? STATE.site.nav
    : [{ label: '首页', path: STATE.site && STATE.site.home || 'index.md' }];

  const home = (STATE.site && STATE.site.home) || nav[0].path;
  const cur = STATE.path || home;

  bar.hidden = false;
  document.getElementById('brandName').textContent = (STATE.site && STATE.site.title) || '内部资料站';
  document.getElementById('who').textContent = STATE.login ? '已授权 · ' + STATE.login : '';

  stage.innerHTML = ''
  + '<div class="cols">'
  +   '<aside class="side">'
  +     '<h4>目录<\/h4>'
  +     '<nav class="nav">' + nav.map(it =>
          '<a href="#/' + encodeURIComponent(it.path) + '"' + (it.path === cur ? ' class="on"' : '') + '>'
          + esc(it.label) + '<\/a>').join('') + '<\/nav>'
  +   '<\/aside>'
  +   '<article class="doc" id="doc"><div class="center"><span class="spin"></span><\/div><\/article>'
  + '<\/div>';

  loadDoc(cur);
}

async function loadDoc(path){
  const doc = document.getElementById('doc');
  if (!doc) return;
  doc.innerHTML = '<div class="center"><span class="spin"></span><\/div>';

  const r = await fetchFile(path, STATE.token);
  if (!r.ok){
    if (r.code === 404)      doc.innerHTML = '<h1>找不到这一页<\/h1><p style="color:var(--fg2)">仓库里没有 <code>' + esc(path) + '<\/code>。检查 <code>' + esc(CONFIG.siteConfig) + '<\/code> 里的路径有没有写错。<\/p>';
    else if (r.code === 401) { localStorage.removeItem(CONFIG.tokenKey); renderLogin('令牌已失效，请重新授权。'); return; }
    else if (r.code === 'toolarge') doc.innerHTML = '<h1>文件太大了<\/h1><p style="color:var(--fg2)">' + esc(path) + ' 有 ' + fmtBytes(r.size) + '，超过了接口单文件 1MB 的上限。<\/p>';
    else doc.innerHTML = '<h1>读取失败<\/h1><p style="color:var(--fg2)">HTTP ' + esc(r.code) + '<\/p>';
    return;
  }

  doc.innerHTML = /\.html?$/i.test(path)
    ? r.text
    : renderMd(r.text);

  document.querySelectorAll('.nav a').forEach(a => {
    a.classList.toggle('on', decodeURIComponent(a.getAttribute('href').slice(2)) === path);
  });

  window.scrollTo(0, 0);
}

/* ==========================================================================
   启动流程
   ========================================================================== */
function onHash(){
  if (!STATE.site) return;
  loadDoc(decodeURIComponent(location.hash.replace(/^#\/?/,'')) || (STATE.site && STATE.site.home) || 'index.md');
}
window.addEventListener('hashchange', onHash);

document.getElementById('exitBtn').addEventListener('click', () => {
  localStorage.removeItem(CONFIG.tokenKey);
  Object.keys(localStorage).forEach(k => { if (k.indexOf(CONFIG.cachePrefix) === 0) localStorage.removeItem(k); });
  STATE.token = null; STATE.cache.clear();
  location.hash = '';
  renderLogin(null);
});

async function boot(){
  if (CONFIG.owner.indexOf('CHANGE-ME') === 0 || CONFIG.repo.indexOf('CHANGE-ME') === 0) {
    renderError('还差一步配置', '打开 index.html，把顶部 CONFIG 里的 owner 和 repo 改成你自己的组织名和内容仓库名，然后再打开这个页面。');
    return;
  }

  const token = STATE.token;
  if (!token) { renderLogin(null); return; }

  renderLoading('正在检查访问权限');

  const [me, cfg] = await Promise.all([
    gh('/user', token),
    fetchFile(CONFIG.siteConfig, token)
  ]);

  if (me.status === 401) {
    localStorage.removeItem(CONFIG.tokenKey);
    renderLogin('令牌已失效，请重新授权。');
    return;
  }

  if (!cfg.ok) {
    if (cfg.code === 404) { renderDenied('noperm'); return; }
    if (cfg.code === 403) { renderDenied('rate', 'HTTP 403 —— 可能是接口限流，也可能是令牌缺少 Contents 权限'); return; }
    renderError('出错了', '读取站点配置失败（HTTP ' + cfg.code + '）');
    return;
  }

  let site;
  try { site = JSON.parse(cfg.text); }
  catch (e) { renderError('配置格式有问题', CONFIG.siteConfig + ' 不是合法的 JSON，检查一下格式。'); return; }

  STATE.site = site;
  STATE.login = me.data && me.data.login;

  const nav = Array.isArray(site.nav) ? site.nav : [];
  STATE.path = decodeURIComponent(location.hash.replace(/^#\/?/,''))
    || site.home
    || (nav[0] && nav[0].path)
    || 'index.md';

  renderDocs();
}

STATE.token = localStorage.getItem(CONFIG.tokenKey);
boot();
</script>
</body>
</html>
