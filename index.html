<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<title>内部资料站</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fff;--soft:#f7f8fa;--line:#e6e9ee;--line2:#d5dae2;
  --fg:#141a23;--fg2:#5a6472;--fg3:#8b95a3;
  --accent:#1a5fd0;--accent-bg:#eff4ff;--accent-line:#c3d7f7;
  --danger:#b42318;--danger-bg:#fef5f4;--danger-line:#f2cbc7;
  --ok:#0f7b3c;--warn-bg:#fffaf0;--warn-line:#f0dcb4;
  --r:10px;--r2:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-word}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* 顶栏 */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:500;font-size:14px;min-width:0}
.brand span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.right{display:flex;align-items:center;gap:10px;flex:none}
.who{font-size:12px;color:var(--fg3);font-family:var(--mono);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.who{display:none}}

.btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--fg);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--fg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg2);padding:6px 8px}
.btn.ghost:hover{background:var(--soft);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 布局 */
.cols{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start;min-height:calc(100vh - 54px)}
.side{border-right:1px solid var(--line);padding:26px 16px 70px;position:sticky;top:54px;max-height:calc(100vh - 54px);overflow:auto}
.side h4{margin:0 0 10px;padding:0 10px;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--fg3);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:block;padding:7px 10px;border-radius:7px;font-size:13.5px;color:var(--fg2);line-height:1.5}
.nav a:hover{background:var(--soft);color:var(--fg);text-decoration:none}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
.doc{padding:34px 44px 90px;max-width:760px;min-width:0}
@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:14px 20px}
  .side h4{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav a{border:1px solid var(--line);padding:5px 11px;font-size:13px}
  .nav a.on{border-color:var(--accent-line)}
  .doc{padding:26px 20px 70px}
}

/* 排版 */
.doc h1{font-size:25px;font-weight:500;margin:0 0 18px;letter-spacing:-.01em}
.doc h2{font-size:19px;font-weight:500;margin:34px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;font-weight:500;margin:26px 0 10px}
.doc h4,.doc h5,.doc h6{font-size:15px;font-weight:500;margin:22px 0 8px;color:var(--fg2)}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px}
.doc li{margin:4px 0}
.doc blockquote{margin:0 0 14px;padding:2px 0 2px 15px;border-left:2px solid var(--line2);color:var(--fg2)}
.doc hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.doc pre.code{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow:auto;margin:0 0 16px;font-size:13px;line-height:1.65}
.doc pre.code code{background:none;border:0;padding:0;font-size:inherit}
.doc strong{font-weight:500}
.doc img{max-width:100%;border-radius:var(--r)}
.doc.wide{max-width:100%}
.doc iframe.html-frame{width:100%;border:0;display:block;min-height:420px;background:#fff;border-radius:var(--r)}
.tw{overflow-x:auto;margin:0 0 16px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc th,.doc td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.doc th{background:var(--soft);font-weight:500}

/* 取回保密资源时的浮层提示 */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;
  max-width:82vw;padding:9px 17px;border-radius:999px;background:#141a23;color:#fff;
  font-size:13px;line-height:1.4;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger)}

/* 门禁页 */
.gate{max-width:640px;margin:0 auto;padding:62px 20px 90px}
.badge{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;margin:0 0 20px;
  background:linear-gradient(140deg,#1a5fd0,#4b8bf5);color:#fff;box-shadow:0 10px 22px -10px rgba(26,95,208,.7)}
.badge svg{width:23px;height:23px}
.gate h1{font-size:24px;font-weight:500;margin:0 0 20px;letter-spacing:-.015em}
.gate .lead{color:var(--fg2);margin:0 0 24px;font-size:14.5px}
.card{border:1px solid var(--line);border-radius:var(--r2);padding:24px 26px;margin:0 0 16px;background:#fff;
  box-shadow:0 1px 2px rgba(20,26,35,.03),0 12px 30px -24px rgba(20,26,35,.4)}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card.bad{background:var(--danger-bg);border-color:var(--danger-line)}
.card.ok{background:var(--accent-bg);border-color:var(--accent-line)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 20px 38px;font-size:14px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(140deg,#1a5fd0,#4b8bf5);color:#fff;font-size:12px;font-weight:500;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -4px rgba(26,95,208,.65)}
.steps li b{font-weight:500}
.hint{font-size:12.5px;color:var(--fg3);line-height:1.7;margin:9px 0 0}
.field{display:flex;gap:8px;margin:22px 0 4px;padding:5px;border:1px solid var(--line2);border-radius:12px;background:var(--soft);
  transition:border-color .15s,box-shadow .15s,background .15s}
.field:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-bg)}
.field input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:13px;padding:8px 11px;
  border:0;border-radius:8px;background:transparent;color:var(--fg)}
.field input:focus{outline:none}
.field input::placeholder{color:var(--fg3)}
.field .btn{border-radius:9px;flex:none}
.msg{font-size:13px;margin-top:12px;min-height:19px}
.msg.err{color:var(--danger)}
.msg.good{color:var(--ok)}
.kbd{font-family:var(--mono);font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.spin{width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--fg3);font-size:14px;padding:70px 0}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg3);line-height:1.75}
@media(max-width:640px){
  .gate{padding:38px 18px 70px}
  .badge{width:42px;height:42px;border-radius:13px;margin-bottom:16px}
  .badge svg{width:20px;height:20px}
  .gate h1{font-size:21px}
  .card{padding:20px 18px;border-radius:12px}
  .steps li{padding:0 0 18px 34px}
}
</style>
</head>
<body>

<header class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="brand"><span class="mark"></span><span class="nm" id="brandName">内部资料站</span></div>
    <div class="right">
      <span class="who" id="who"></span>
      <button class="btn ghost" id="exitBtn" type="button">退出</button>
    </div>
  </div>
</header>

<main id="stage"><div class="center"><span class="spin"></span></div></main>

<script>
/* ==========================================================================
   配置区 —— 部署前只需要改这一段
   ========================================================================== */
const CONFIG = {
  owner: 'bjtu-guitar-association',
  repo:  'inner-content',
  branch: 'main',
  siteConfig: '_site.json',

  /* HTML 页面里的「相对路径」资源（图片、附件下载）要去哪里取。
     · 留空  → 不重写，相对路径会失效（图片全裂）
     · 填地址 → 把 src="assets/x.jpg" 自动补成 <resourceBase>assets/x.jpg
     注意：这只影响资源去哪取，不影响内容保密 —— 内容仓库里的 HTML 依然是私有的。 */
  resourceBase: 'https://bjtu-guitar-association.github.io/.github.io/',

  /* 内站页面里的「保密资源」前缀。
     src/href 写成 @private/xxx 时，外壳会带着令牌从内容仓库把文件取回来，
     再用 blob 交给页面 —— 字节只存在于当前页面内存里，
     公开站和公开仓库里都不会有它。
       <img src="@private/a.png">   → 页面载入后自动取回并替换
       <a href="@private/b.docx">   → 点击时取回并下载，不跳转、地址栏不留痕
     与之相对：写相对路径（assets/x.jpg）的，走上面的 resourceBase，从公开站取。 */
  privatePrefix: '@private/',

  /* 内站页面里的「跨页跳转」前缀。
     iframe 里的 #/xxx 会被浏览器当成它自己的页内锚点，走不到外壳的路由，
     所以内站 HTML 里要跳到另一个内站页面，必须写成 #__page/xxx.html。 */
  pagePrefix: '#__page/',

  tokenKey: 'ghgate.token.v1',
  cachePrefix: 'ghgate.cache.',
  cacheTtl: 5 * 60 * 1000
};

const API = 'https://api.github.com';
const stage = document.getElementById('stage');
const bar = document.getElementById('bar');

let STATE = { token: null, login: null, site: null, path: null, cache: new Map(), blobs: [] };

/* ---------- 小工具 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function b64utf8(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

/* ==========================================================================
   Markdown 渲染器（自实现，零 CDN 依赖）
   ========================================================================== */
function renderMd(src){
  const codes = [];
  let t = String(src).replace(/\r\n?/g,'\n');

  // 1. 先摘出围栏代码块，避免内部被当成 markdown 解析
  t = t.replace(/```([^\n]*)\n([\s\S]*?)(?:```|$)/g, (m, info, code) => {
    codes.push({ info: String(info).trim(), code: code.replace(/\n+$/,'') });
    return '\u0001C' + (codes.length - 1) + '\u0001';
  });

  // 2. 整体转义，之后所有替换都在安全文本上进行
  t = esc(t);

  // 3. 行内元素
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  t = t.replace(/(?<![*\w])\*([^\s*](?:[^*\n]*[^\s*])?)\*(?![*\w])/g, '<em>$1</em>');
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) => {
    const pv = privatePath(src);
    // 保密图片：同样不能留在 src 上（一进 DOM 就发请求），挂到 data-private
    if (pv !== null) return '<img data-private="'+attrEsc(pv)+'" data-private-attr="src" alt="'+alt+'">';
    return /^(https?:|\/)/i.test(src) ? '<img src="'+src+'" alt="'+alt+'">' : alt;
  });
  t = t.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (m, txt, href) => {
    const safe = /^(https?:|\/|#|mailto:|@private\/)/i.test(href) ? href : '#';
    return '<a href="'+safe+'" target="_blank" rel="noopener noreferrer">' + (txt || href) + '</a>';
  });

  // 4. 逐行做块级结构
  const lines = t.split('\n');
  const out = [];
  let listType = null, para = [];

  const closeList = () => { if (listType) { out.push('</' + listType + '>'); listType = null; } };
  const flushPara = () => { if (para.length) { out.push('<p>' + para.join(' ') + '</p>'); para = []; } };
  const flushAll  = () => { flushPara(); closeList(); };

  for (let i = 0; i < lines.length; i++){
    const line = lines[i].trim();

    if (/^\u0001C\d+\u0001$/.test(line)) { flushAll(); out.push(line); continue; }
    if (!line) { flushAll(); continue; }

    // 表格
    if (line.charAt(0) === '|' && /^\|[\s:\-|]+\|$/.test((lines[i+1]||'').trim())) {
      flushAll();
      const rows = [line];
      i += 2;
      while (i < lines.length && lines[i].trim().charAt(0) === '|') { rows.push(lines[i].trim()); i++; }
      i--;
      const cut = r => r.replace(/^\||\|$/g,'').split('|').map(c => c.trim());
      out.push('<div class="tw"><table>' + rows.map((r, k) =>
        '<tr>' + cut(r).map(c => '<' + (k ? 'td' : 'th') + '>' + c + '</' + (k ? 'td' : 'th') + '>').join('') + '</tr>'
      ).join('') + '</table></div>');
      continue;
    }

    // 标题
    let m = line.match(/^(#{1,6})\s+(.+)$/);
    if (m) { flushAll(); const lv = m[1].length; out.push('<h' + lv + '>' + m[2] + '</h' + lv + '>'); continue; }

    // 分隔线
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { flushAll(); out.push('<hr>'); continue; }

    // 引用
    if (line.indexOf('&gt;') === 0) {
      flushAll();
      const q = [];
      while (i < lines.length && lines[i].trim().indexOf('&gt;') === 0) {
        q.push(lines[i].trim().replace(/^&gt;\s?/,''));
        i++;
      }
      i--;
      out.push('<blockquote>' + q.join(' ') + '</blockquote>');
      continue;
    }

    // 列表
    m = line.match(/^([-*+])\s+(.+)$/);
    if (m) {
      flushPara();
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + m[2] + '</li>');
      continue;
    }
    m = line.match(/^(\d+)[.)]\s+(.+)$/);
    if (m) {
      flushPara();
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + m[2] + '</li>');
      continue;
    }

    para.push(line);
  }
  flushAll();

  // 5. 还原代码块
  return out.join('\n').replace(/\u0001C(\d+)\u0001/g, (m, idx) => {
    const c = codes[+idx];
    const lang = c.info ? ' data-lang="' + esc(c.info.split(/\s+/)[0]) + '"' : '';
    return '<pre class="code"><code' + lang + '>' + esc(c.code) + '</code></pre>';
  });
}

/* ==========================================================================
   GitHub API
   ========================================================================== */
/* 把仓库里的路径拼成接口 URL 时，必须「先解码、再编码」。
   原因：主站 HTML 里的引用本来就是 %20 这种已编码写法，若直接 encodeURIComponent，
   百分号会被再编一次（%20 变成 %2520），接口直接 404。
   已用真实仓库实测确认：logo%20GA.png → 200，logo%2520GA.png → 404。 */
function encSeg(seg){
  let v = String(seg);
  try { v = decodeURIComponent(v); } catch (e) { /* 含裸 % 的罕见文件名，保持原样 */ }
  return encodeURIComponent(v);
}
function encPath(p){
  return String(p).split('/').map(encSeg).join('/');
}

async function gh(path, token){
  const res = await fetch(API + path, {
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json'
    },
    cache: 'no-store'
  });
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  return { status: res.status, data: data, headers: res.headers };
}

/* 单个文件超过 1MB 时，上面的默认响应只给元数据（encoding 会是 none，content 是空的）。
   这时改用 raw 媒体类型直接取原始字节 —— 同一个端点，换成 Accept 头即可。
   实测：4.24MB 的文件能完整拿到 4447036 字节；上限是 GitHub 的单文件硬限制 100MB。
   Accept 属于 CORS 安全列表头，不会额外触发预检。 */
async function ghRaw(path, token){
  const res = await fetch(API + path, {
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github.raw+json'
    },
    cache: 'no-store'
  });
  if (!res.ok) return { status: res.status, text: null };
  return { status: 200, text: await res.text() };
}

async function fetchFile(path, token){
  const key = CONFIG.cachePrefix + path;
  const hit = STATE.cache.get(path) || (() => {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  })();

  if (hit && Date.now() - hit.at < CONFIG.cacheTtl) {
    STATE.cache.set(path, hit);
    return { ok: true, text: hit.text, cached: true };
  }

  const url = '/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/'
            + encPath(path)
            + '?ref=' + encodeURIComponent(CONFIG.branch);
  const r = await gh(url, token);

  if (r.status === 200 && r.data) {
    if (r.data.encoding === 'none' || !r.data.content) {
      // 超过 1MB：不用默认响应，改用 raw 媒体类型重取一次
      const big = await ghRaw(url, token);
      if (big.status === 200 && typeof big.text === 'string' && big.text.length) {
        const rec = { at: Date.now(), text: big.text, big: true };
        STATE.cache.set(path, rec);
        return { ok: true, text: big.text, cached: false, big: true };
      }
      return { ok: false, code: 'toolarge', size: r.data.size || 0 };
    }
    const text = b64utf8(r.data.content);
    const rec = { at: Date.now(), text: text };
    STATE.cache.set(path, rec);
    // 只把 1MB 以下的文本写进 localStorage —— 配额通常只有 5MB，大文件会把缓存挤爆
    if (text.length < 512 * 1024) {
      try { localStorage.setItem(key, JSON.stringify(rec)); } catch (e) {}
    }
    return { ok: true, text: text, cached: false };
  }
  return { ok: false, code: r.status };
}

/* ==========================================================================
   渲染
   ========================================================================== */
function goHome(url){ location.href = url || location.pathname; }

function renderLoading(text){
  stage.innerHTML = '<div class="center"><span class="spin"></span> ' + esc(text || '正在检查访问权限') + '<\/div>';
}

function renderLogin(reason){
  bar.hidden = true;
  const turl = 'https://github.com/settings/personal-access-tokens/new'
    + '?name=' + encodeURIComponent(CONFIG.owner + ' 资料站')
    + '&description=' + encodeURIComponent('只读访问 ' + CONFIG.owner + '/' + CONFIG.repo)
    + '&target_name=' + encodeURIComponent(CONFIG.owner);

  stage.innerHTML = ''
  + '<div class="gate">'
  +   '<div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M7.8 10.5V7.9a4.2 4.2 0 0 1 8.4 0v2.6"/><circle cx="12" cy="15.6" r="1.3"/><\/svg><\/div>'
  +   '<h1>需要授权才能查看</h1>'

/* ==========================================================================
   保密资源 · 跨页跳转
   --------------------------------------------------------------------------
   内站 HTML 里只有两种写法，没有第三种，不要自创：

   ① 公开资源（留在公开站上的图片、附件）
        src="assets/images/x.jpg"            相对路径，外壳自动补 resourceBase
   ② 保密资源（只放在内容仓库里的文件）
        src="@private/assets/xxx.png"        外壳带令牌取回，用 blob 交给页面
        href="@private/assets/xxx.docx"      点击时取回并下载

   为什么保密资源不能直接写 src：<img> 一进 DOM 就会发请求，
   而公开站上根本没有这个文件 —— 会先产生一次注定 404 的请求。
   所以 rewriteRefs 会把 src 上的 @private 摘下来挂到 data-private，
   等这里带令牌取回后再填回去。<a href> 不点不发请求，原样保留即可。

   ③ 跨页跳转（内站有多个页面时）
        href="#__page/forms.html"           交给外壳的路由切换页面
      iframe 里的 #/xxx 会被当成它自己的页内锚点，走不到外壳路由，必须用 #__page/。
   ========================================================================== */
function attrEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function mimeOf(name){
  const e = String(name).split('.').pop().toLowerCase();
  return {
    jpg:'image/jpeg', jpeg:'image/jpeg', jpe:'image/jpeg', png:'image/png',
    gif:'image/gif', webp:'image/webp', svg:'image/svg+xml', bmp:'image/bmp',
    avif:'image/avif', ico:'image/x-icon', pdf:'application/pdf'
  }[e] || '';
}

/* api.github.com 的 raw 媒体类型直接给原始字节，图片和文档都能取，且不受 1MB 限制 */
async function ghBlob(path, token){
  const url = '/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/'
            + encPath(path)
            + '?ref=' + encodeURIComponent(CONFIG.branch);
  const res = await fetch(API + url, {
    headers: { 'Authorization': 'Bearer ' + token,
               'Accept': 'application/vnd.github.raw+json' },
    cache: 'no-store'
  });
  if (!res.ok) return { ok: false, status: res.status };
  const raw = await res.blob();
  const t = mimeOf(path) || (raw.type && raw.type !== 'application/octet-stream' ? raw.type : 'application/octet-stream');
  return { ok: true, blob: new Blob([raw], { type: t }) };
}

function privatePath(v){
  const p = CONFIG.privatePrefix;
  const s = String(v || '');
  return (p && s.indexOf(p) === 0) ? s.slice(p.length) : null;
}

function pagePath(v){
  const p = CONFIG.pagePrefix;
  const s = String(v || '');
  return (p && s.indexOf(p) === 0) ? s.slice(p.length) : null;
}

function revokeBlobs(){
  (STATE.blobs || []).forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
  STATE.blobs = [];
}

function toast(msg, bad){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.className = 'toast'; }, 2800);
}

/* root 可以是 iframe 元素，也可以是外壳里的 #doc 元素（Markdown 页面用） */
function hydratePrivate(root, onPicturesDone){
  let d;
  try { d = root.contentDocument || root; } catch (e) { return; }
  if (!d || !d.querySelectorAll) return;

  // ① 保密图片：带令牌取回，换成 blob URL
  const jobs = [];
  Array.prototype.forEach.call(d.querySelectorAll('[data-private]'), function(el){
    const p = el.getAttribute('data-private');
    const attr = el.getAttribute('data-private-attr') || 'src';
    el.removeAttribute('data-private');
    el.removeAttribute('data-private-attr');
    jobs.push(ghBlob(p, STATE.token).then(function(rs){
      if (!rs.ok){
        toast(rs.status === 401 ? '令牌失效了，保密图片取不回来' : '保密图片取回失败（HTTP ' + rs.status + '）', true);
        return;
      }
      const u = URL.createObjectURL(rs.blob);
      STATE.blobs.push(u);
      el.setAttribute(attr, u);
    }));
  });

  // ② 点击：保密附件走下载，跨页跳转交给外壳路由。只绑一次。
  if (!d.__ghBound){
    d.__ghBound = true;
    d.addEventListener('click', async function(ev){
      const t = ev.target;
      const a = t && t.closest ? t.closest('a') : null;
      if (!a) return;
      const href = a.getAttribute('href') || '';

      const pg = pagePath(href);
      if (pg !== null){ ev.preventDefault(); location.hash = '#/' + encodeURIComponent(pg); return; }

      const p = privatePath(href);
      if (p === null) return;
      ev.preventDefault();
      if (a.dataset.busy) return;
      a.dataset.busy = '1';

      const name = decodeURIComponent(p.split('/').pop());
      toast('正在取回 ' + name + ' …');
      try {
        const rs = await ghBlob(p, STATE.token);
        if (!rs.ok){
          toast(rs.status === 401 ? '令牌已失效，请重新授权' : '取回失败（HTTP ' + rs.status + '）', true);
          return;
        }
        const u = URL.createObjectURL(rs.blob);
        const can = document.createElement('a');
        can.href = u; can.download = name;
        document.body.appendChild(can); can.click(); can.remove();
        setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
        toast('已开始下载 ' + name);
      } finally {
        delete a.dataset.busy;
      }
    });
  }

  // 图片到位后 iframe 高度会变，重新量一次
  if (jobs.length && onPicturesDone) {
    Promise.all(jobs).then(function(){ onPicturesDone(); setTimeout(onPicturesDone, 300); });
  }
}

/* HTML 页面为什么不直接 innerHTML 塞进来 —— 三个真实原因：
   ① 原页面的 <style> 会顺着 DOM 泄漏到外壳上，导航栏和正文字体全被改掉
   ② innerHTML 注入的 <script> 按 HTML 规范不会执行，页面的交互会静默失效
   ③ 原页面的页内锚点（href="#sec-3"）会和外壳的 hash 路由（#/path）打架，
      点一下就变成「找不到这一页」
   用 iframe 承载，这三个问题一次性隔离掉。 */
/* CSS 里的 url() 只在 <style> 块和行内 style 属性里重写 —— 不做全局替换，
   是为了绝不误伤 <script> 里拼 URL 的 JS 字符串。
   注意：保密图片仍然不要写成 background-image，CSS 请求带不上令牌，取不回来。 */
function rewriteCssUrls(css, b, bump){
  return css.replace(
    /url\(\s*(["']?)(?!https?:|\/\/|data:|blob:|@private\/)([^"')]+)\1\s*\)/gi,
    function(m, q, val){
      bump();
      return 'url(' + q + b + val.replace(/^\/+/, '') + q + ')';
    });
}

function rewriteRefs(html, base){
  if (base === undefined) base = CONFIG.resourceBase;
  const b = base ? String(base).replace(/\/+$/, '/') : '';
  let count = 0;
  const bump = function(){ count++; };

  html = html.replace(
    /\b(src|href|poster|data-src)\s*=\s*(["'])(?!#|https?:|\/\/|data:|mailto:|tel:|javascript:|blob:)([^"']*)\2/gi,
    function(m, attr, q, val){
      if (!val) return m;

      // 保密资源（@private/）
      const pv = privatePath(val);
      if (pv !== null){
        // <a href> 不点不发请求 —— 原样保留，点击时由 hydratePrivate 带令牌取回
        if (attr.toLowerCase() === 'href') return m;
        // <img src>/<video poster> 一进 DOM 就会请求，先摘下来挂到 data-private
        return 'data-private="' + attrEsc(pv) + '" data-private-attr="' + attrEsc(attr) + '"';
      }

      // 公开资源：补上 resourceBase。
      // 值开头的 / 要去掉 —— 否则 base 末尾的 / 和它拼在一起会变成双斜杠。
      if (!b) return m;
      bump();
      return attr + '=' + q + b + val.replace(/^\/+/, '') + q;
    });

  if (!b) return { html: html, count: count };

  // ① <style> 块
  html = html.replace(/(<style\b[^>]*>)([\s\S]*?)(<\/style>)/gi,
    function(m, open, css, close){ return open + rewriteCssUrls(css, b, bump) + close; });

  // ② 行内 style="…"
  html = html.replace(/(\sstyle\s*=\s*)(["'])([\s\S]*?)\2/gi,
    function(m, pre, q, css){ return pre + q + rewriteCssUrls(css, b, bump) + q; });

  return { html: html, count: count };
}

function buildHtmlFrame(raw, path){
  const frame = document.createElement('iframe');
  frame.className = 'html-frame';
  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
  frame.setAttribute('title', path);
  frame.srcdoc = rewriteRefs(raw, CONFIG.resourceBase).html;

  /* iframe 不会自己长高，要量它的内容高度回填。图片是异步加载的，
     所以量三次：load 时、400ms 后、1200ms 后。 */
  const fit = function(){
    try {
      const d = frame.contentDocument;
      if (!d) return;
      const h = Math.max(
        d.documentElement ? d.documentElement.scrollHeight : 0,
        d.body ? d.body.scrollHeight : 0);
      if (h > 0) frame.style.height = h + 'px';
    } catch (e) {}
  };
  frame.addEventListener('load', function(){
    fit();
    setTimeout(fit, 400);
    setTimeout(fit, 1200);
    hydratePrivate(frame, fit);   // 保密图片到位后再量一次高度
  });
  return frame;
}

async function loadDoc(path){
  const doc = document.getElementById('doc');
  if (!doc) return;
  revokeBlobs();   // 上一页的 blob URL 到这里就没用了，释放掉
  doc.innerHTML = '<div class="center"><span class="spin"></span><\/div>';

  const r = await fetchFile(path, STATE.token);
  if (!r.ok){
    doc.classList.remove('wide');
    if (r.code === 404)      doc.innerHTML = '<h1>找不到这一页<\/h1><p style="color:var(--fg2)">仓库里没有 <code>' + esc(path) + '<\/code>。检查 <code>' + esc(CONFIG.siteConfig) + '<\/code> 里的路径有没有写错。<\/p>';
    else if (r.code === 401) { localStorage.removeItem(CONFIG.tokenKey); renderLogin('令牌已失效，请重新授权。'); return; }
    else if (r.code === 'toolarge') doc.innerHTML = '<h1>文件太大了<\/h1><p style="color:var(--fg2)">' + esc(path) + ' 有 ' + fmtBytes(r.size) + '，取不回来。GitHub 的单文件硬上限是 100MB。<\/p>';
    else doc.innerHTML = '<h1>读取失败<\/h1><p style="color:var(--fg2)">HTTP ' + esc(r.code) + '<\/p>';
    return;
  }

  const isHtml = /\.html?$/i.test(path);
  doc.classList.toggle('wide', isHtml);

  if (isHtml){
    doc.innerHTML = '';
    doc.appendChild(buildHtmlFrame(r.text, path));
  } else {
    doc.innerHTML = renderMd(r.text);
    hydratePrivate(doc);          // Markdown 页面里也可能有 @private/ 的图片和附件
  }

  document.querySelectorAll('.nav a').forEach(a => {
    a.classList.toggle('on', decodeURIComponent(a.getAttribute('href').slice(2)) === path);
  });

  window.scrollTo(0, 0);
}

   启动流程
   ========================================================================== */
function onHash(){
  if (!STATE.site) return;
  loadDoc(decodeURIComponent(location.hash.replace(/^#\/?/,'')) || (STATE.site && STATE.site.home) || 'index.md');
}
window.addEventListener('hashchange', onHash);

function logout(){
  localStorage.removeItem(CONFIG.tokenKey);
  Object.keys(localStorage).forEach(k => { if (k.indexOf(CONFIG.cachePrefix) === 0) localStorage.removeItem(k); });
  STATE.token = null; STATE.login = null; STATE.cache.clear();
  /* site / path 也要一起清掉：下面那句 location.hash = '' 会排队触发一次
     hashchange，若 STATE.site 还在，onHash 会试图重新加载文档。 */
  STATE.site = null; STATE.path = null;
  revokeBlobs();
  location.hash = '';
  renderLogin(null);
}

document.getElementById('exitBtn').addEventListener('click', logout);

/* 内站 HTML 顶部可能也放一个「退出」按钮。它装在 iframe 里，沙箱不允许它
   自己跳转顶层页面，所以它 postMessage 过来，由外壳代它完成同一次登出。
   只认页内 iframe 发来的消息，外部窗口伪造的一律忽略。 */
window.addEventListener('message', function(ev){
  const d = ev.data;
  if (!d || d.type !== 'ghgate:logout') return;
  const frames = document.querySelectorAll('iframe');
  for (let i = 0; i < frames.length; i++) {
    if (frames[i].contentWindow === ev.source) { logout(); return; }
  }
});

async function boot(){
  if (CONFIG.owner.indexOf('CHANGE-ME') === 0 || CONFIG.repo.indexOf('CHANGE-ME') === 0) {
    renderError('还差一步配置', '打开 index.html，把顶部 CONFIG 里的 owner 和 repo 改成你自己的组织名和内容仓库名，然后再打开这个页面。');
    return;
  }

  const token = STATE.token;
  if (!token) { renderLogin(null); return; }

  renderLoading('正在检查访问权限');

  const [me, cfg] = await Promise.all([
    gh('/user', token),
    fetchFile(CONFIG.siteConfig, token)
  ]);

  if (me.status === 401) {
    localStorage.removeItem(CONFIG.tokenKey);
    renderLogin('令牌已失效，请重新授权。');
    return;
  }

  if (!cfg.ok) {
    if (cfg.code === 404) { renderDenied('noperm'); return; }
    if (cfg.code === 403) { renderDenied('rate', 'HTTP 403 —— 可能是接口限流，也可能是令牌缺少 Contents 权限'); return; }
    renderError('出错了', '读取站点配置失败（HTTP ' + cfg.code + '）');
    return;
  }

  let site;
  try { site = JSON.parse(cfg.text); }
  catch (e) { renderError('配置格式有问题', CONFIG.siteConfig + ' 不是合法的 JSON，检查一下格式。'); return; }

  STATE.site = site;
  STATE.login = me.data && me.data.login;

  const nav = Array.isArray(site.nav) ? site.nav : [];
  STATE.path = decodeURIComponent(location.hash.replace(/^#\/?/,''))
    || site.home
    || (nav[0] && nav[0].path)
    || 'index.md';

  renderDocs();
}

STATE.token = localStorage.getItem(CONFIG.tokenKey);
boot();
</script>
</body>
</html>
